# JIT Episodic Memory — Conda Environment
# Reproduces the exact environment used for the thesis evaluation.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate jit
#
# Hardware tested: NVIDIA RTX 4060 Ti 8 GB, Ubuntu 22.04
# Python: 3.12.12
# CUDA: 12.x (via PyTorch pip wheels)

name: jit
channels:
  - defaults
dependencies:
  - python=3.12.12

  # ── All Python packages installed via pip ──
  - pip
  - pip:
    # Core ML
    - torch==2.10.0
    - torchvision==0.25.0
    - triton==3.6.0

    # Vision-Language Models
    - open-clip-torch==3.2.0
    - transformers==5.1.0
    - tokenizers==0.22.2
    - timm==1.0.24

    # Vector Search
    - faiss-cpu==1.13.2

    # Clustering & ML utilities
    - scikit-learn==1.8.0
    - scipy==1.17.0

    # Data Processing
    - numpy==2.4.2
    - pandas==3.0.0
    - pyarrow==23.0.0

    # Image Processing
    - pillow==12.1.1

    # Visualization
    - matplotlib==3.10.8

    # Hugging Face ecosystem
    - huggingface-hub==1.4.1
    - safetensors==0.7.0

    # Text processing (used by open-clip)
    - ftfy==6.3.1
    - regex==2026.1.15

    # Utilities
    - tqdm==4.67.3
    - pyyaml==6.0.3
    - filelock==3.20.3
    - fsspec==2026.2.0
    - jinja2==3.1.6
    - packaging==25.0
    - typing-extensions==4.15.0
    - networkx==3.6.1
    - sympy==1.14.0
    - joblib==1.5.3
    - threadpoolctl==3.6.0

    # ── Habitat-Sim ──
    # NOT available via pip. Build from source:
    #   cd habitat/habitat-sim && pip install -e .
    # Or install via conda (if compatible version exists):
    #   conda install habitat-sim -c conda-forge -c aihabitat
